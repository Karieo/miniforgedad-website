<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starting Soon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #f5efe4;
    font-family: 'EB Garamond', Georgia, serif;
  }
  .grid {
    position: fixed;
    inset: 0;
    background-color: #f5efe4;
    background-image:
      linear-gradient(#d8cfc0 0.7px, transparent 0.7px),
      linear-gradient(90deg, #d8cfc0 0.7px, transparent 0.7px);
    background-size: 48px 48px;
  }
  .content {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-area img {
    max-height: 540px;
    max-width: 860px;
    object-fit: contain;
  }
  .text-band {
    width: 100%;
    background: #ede6d6;
    border-top: 2px solid rgba(232,148,58,0.4);
    padding: 34px 0 38px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .channel-name {
    font-size: 74px;
    font-weight: 700;
    color: #1a1410;
    letter-spacing: 3px;
  }
  .tagline {
    font-size: 21px;
    color: #c8607a;
    letter-spacing: 10px;
    text-transform: uppercase;
  }
  .badge {
    display: inline-block;
    padding: 9px 48px;
    border-radius: 40px;
    border: 1.5px solid #e8943a;
    background: rgba(232,148,58,0.12);
    font-size: 20px;
    color: #c8603a;
    letter-spacing: 7px;
    text-transform: uppercase;
  }
  .flavor { font-size: 19px; color: #8a6050; letter-spacing: 2px; }
  .flavor2 { font-size: 17px; color: #a08060; letter-spacing: 1px; font-style: italic; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="content">
    <div class="logo-area">
      <img src="logo.png" alt="miniforgedad logo">
    </div>
    <div class="text-band">
      <div class="channel-name">@MINIFORGEDAD</div>
      <div class="tagline">Mini Masters: Dad-Son Painting</div>
      <div class="badge">Starting Soon</div>
      <div class="flavor">Grab a brush and pull up a chair ✦</div>
      
    </div>
  </div>
</body>
</html>
